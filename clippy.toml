# We accept bigger lines here, as some of the folding and tokenization functions will need it
too-many-lines-threshold = 100
cognitive-complexity-threshold = 30
too-many-arguments-threshold = 5
max-fn-params-bools = 2
max-struct-bools = 2
enum-variant-size-threshold = 128
future-size-threshold = 4096
type-complexity-threshold = 200
msrv = "1.99"
stack-size-threshold = 16384
avoid-breaking-exported-api = false
doc-valid-idents = [
  "Coraza",
  "OWASP",
  "CRS",
  "WAF",
  "ModSecurity",
  "SecLang",
  "IPv4",
  "IPv6",
  "gRPC",
  "regex",
]
# No methods are banned yet; add entries here as concrete needs arise
# (mirrors praxis's pattern, but this is a library, not a proxy, so their
# thread::sleep/stdin bans don't apply out of the box).
disallowed-methods = []
