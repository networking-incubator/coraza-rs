[package]
name = "libperfusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "BSD-3-Clause"
repository.workspace = true
description = "A pure Rust port of libinjection for SQL injection and XSS detection"
keywords = ["libinjection", "sqli", "xss", "sql-injection", "waf"]
readme = "README.md"
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "LICENSES/**",
    "THIRD_PARTY_NOTICES.md",
    "build.rs",
    "data/**",
    "src/**",
]

[lib]
bench = false

[dependencies]
memchr = { version = "2.7", default-features = false, features = ["std"] }

[features]
internals = []

[dev-dependencies]
libperfusion = { path = ".", features = ["internals"] }

[[bench]]
name = "speed"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "scaling"
harness = false

[lints]
workspace = true
