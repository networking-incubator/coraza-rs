services:
  echo:
    image: registry.k8s.io/gateway-api/conformance/echo-basic:v0.2.0
    expose:
      - "3000"

  grpc-echo:
    image: registry.k8s.io/gateway-api/conformance/echo-basic:v0.2.0
    environment:
      GRPC_ECHO_SERVER: "1"
    expose:
      - "3000"

  envoy:
    image: ${ENVOY_IMAGE:?run the harness or set ENVOY_IMAGE}
    command:
      - -c
      - /etc/envoy/config/${ENVOY_CONFIG:-envoy.yaml}
      - --log-level
      - info
    depends_on:
      - echo
      - grpc-echo
    ports:
      - "10000:10000"
    volumes:
      - ./:/etc/envoy/config:ro
      - ../../target/wasm32-wasip1/release/envoy_libperfusion.wasm:/etc/envoy/libperfusion.wasm:ro
