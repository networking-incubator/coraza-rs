# Gateway API gateway backed by the Istio gateway-class controller.
#
# Verified against Istio 1.30.5/1.30.7: the controller creates a Deployment
# named coraza-gateway-istio whose pods carry the workload label
# gateway.networking.k8s.io/gateway-name=coraza-gateway (the label the
# EnvoyFilter selects on) and an Envoy listener 0.0.0.0_80 that binds port 80
# directly in the pod (Service targetPort 80).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coraza-gateway
  namespace: coraza-istio
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coraza-backend
  namespace: coraza-istio
spec:
  parentRefs:
    - name: coraza-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coraza-backend
          port: 3000
