services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"

  envoy:
    image: ${ENVOY_IMAGE:?run the harness or set ENVOY_IMAGE}
    command:
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - warning
    depends_on:
      - backend
    ports:
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:9901:9901"
    volumes:
      - ${ENVOY_CORAZA_CONFIG:-./envoy.yaml}:/etc/envoy/envoy.yaml:ro
      - ${ENVOY_CORAZA_WASM:-../../target/wasm32-wasip1/release/envoy_coraza.wasm}:/etc/envoy/envoy_coraza.wasm:ro
