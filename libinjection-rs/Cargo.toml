[package]
name = "libinjection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND BSD-3-Clause"
repository.workspace = true
description = "Pure Rust byte-oriented SQLi and XSS detection and bounded analysis."
include = [
    "Cargo.toml",
    "README.md",
    "build.rs",
    "data/**",
    "docs/**",
    "LICENSES/**",
    "src/**",
    "tests/**",
    "THIRD_PARTY_NOTICES.md",
    "tools/**",
    "!tools/**/__pycache__/**",
    "!tools/**/*.pyc",
]

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = ["legacy"]
legacy = []

[dependencies]
memchr = { version = "2", default-features = false, features = ["std"] }

[[test]]
name = "corpus_parse"
path = "tests/corpus_parse.rs"
required-features = ["legacy"]

[[test]]
name = "detection_api"
path = "tests/detection_api.rs"
required-features = ["legacy"]

[[test]]
name = "fuzz_regressions"
path = "tests/fuzz_regressions.rs"
required-features = ["legacy"]

[dev-dependencies]
