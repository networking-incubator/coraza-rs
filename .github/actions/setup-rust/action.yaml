name: Setup Rust

description: Install Rust toolchain with workspace caching.

inputs:
  cache-suffix:
    description: Optional cache key suffix.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Read Rust version from toolchain file
      id: rust
      shell: bash
      run: |
        VERSION=$(awk -F '"' '/channel = / { print $2 }' rust-toolchain.toml)
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: ${{ steps.rust.outputs.version }}
        components: clippy,rustfmt

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-suffix }}
        cache-bin: false
