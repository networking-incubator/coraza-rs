name: Setup Rust Lint

description: Install rustfmt nightly and stable lint toolchain.

inputs:
  nightly:
    description: Nightly toolchain version for rustfmt.
    required: false
    default: nightly

runs:
  using: composite
  steps:
    - name: Read stable Rust version from toolchain file
      id: rust
      shell: bash
      run: |
        VERSION=$(awk -F '"' '/channel = / { print $2 }' rust-toolchain.toml)
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: ${{ steps.rust.outputs.version }}
        components: clippy

    - name: Install nightly rustfmt
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: ${{ inputs.nightly }}
        components: rustfmt

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: lint-${{ inputs.nightly }}
        cache-bin: false
