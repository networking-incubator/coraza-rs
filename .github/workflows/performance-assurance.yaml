name: Performance assurance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "release/**"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  hostile-scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: performance-scaling

      - name: Set up pinned Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: Check out pinned Go oracle source
        env:
          GO_SOURCE: ${{ runner.temp }}/libinjection-go-v033
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/corazawaf/libinjection-go.git "$GO_SOURCE"
          git -C "$GO_SOURCE" fetch --depth=1 origin f6c336efc0ddac2597fd27d3b1b7db9c87613e8d
          git -C "$GO_SOURCE" checkout --detach f6c336efc0ddac2597fd27d3b1b7db9c87613e8d
          test "$(git -C "$GO_SOURCE" rev-parse HEAD)" = f6c336efc0ddac2597fd27d3b1b7db9c87613e8d

      - name: Run paired hostile-input scaling gate
        env:
          GO_SOURCE: ${{ runner.temp }}/libinjection-go-v033
        run: >-
          python3 libinjection-rs/tools/perf/scaling.py
          --go-source "$GO_SOURCE"
          --artifact-dir "$RUNNER_TEMP/perf-scaling"
          --samples 9 --warmup 1 --rounds 3 --idle-timeout 180

      - name: Upload scaling report, inputs, and raw samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-scaling-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/perf-scaling/scaling.json
            ${{ runner.temp }}/perf-scaling/inputs/**
            ${{ runner.temp }}/perf-scaling/round*.tsv.gz
            ${{ runner.temp }}/perf-scaling/go-scaling-driver
            ${{ runner.temp }}/perf-scaling/rust-scaling-driver
          if-no-files-found: warn
          retention-days: 30

  analyzer-scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: analyzer-scaling

      - name: Measure analyzer latency and allocation growth
        run: >-
          python3 libinjection-rs/tools/perf/analyze_scaling.py
          --rounds 7
          --output "$RUNNER_TEMP/analyzer-scaling/report.json"

      - name: Upload analyzer scaling report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analyzer-scaling-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analyzer-scaling/report.json
          if-no-files-found: warn
          retention-days: 30

  stack-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: stack-evidence

      - name: Install WASI target
        run: rustup target add wasm32-wasip1 --toolchain 1.97.1

      - name: Refresh native and WASM stack evidence
        run: >-
          python3 libinjection-rs/tools/stack/measure.py
          --artifact-dir "$RUNNER_TEMP/stack-evidence/builds"
          --output "$RUNNER_TEMP/stack-evidence/report.json"

      - name: Upload stack report and probe binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stack-evidence/report.json
            ${{ runner.temp }}/stack-evidence/builds/**/plain-*
          if-no-files-found: warn
          retention-days: 30

  focused-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: focused-fuzz

      - name: Install nightly fuzz toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-10-06
          components: rust-src

      - name: Install cargo-fuzz
        run: cargo +1.97.1 install --root "$RUNNER_TEMP/cargo-fuzz" --locked cargo-fuzz --version 0.13.2

      - name: Run raw-byte and SQL/HTML grammar campaigns
        env:
          ASAN_OPTIONS: detect_leaks=0
        working-directory: libinjection-rs
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz/corpus/raw_bytes" "$RUNNER_TEMP/fuzz/corpus/sql_grammar" "$RUNNER_TEMP/fuzz/corpus/html_grammar"
          mkdir -p "$RUNNER_TEMP/fuzz/artifacts/raw_bytes" "$RUNNER_TEMP/fuzz/artifacts/sql_grammar" "$RUNNER_TEMP/fuzz/artifacts/html_grammar"
          export PATH="$RUNNER_TEMP/cargo-fuzz/bin:$PATH"
          cargo +nightly-2026-10-06 fuzz run raw_bytes "$RUNNER_TEMP/fuzz/corpus/raw_bytes" -- -seed=20261007 -max_total_time=60 -timeout=5 -max_len=65535 -artifact_prefix="$RUNNER_TEMP/fuzz/artifacts/raw_bytes/" > "$RUNNER_TEMP/fuzz/raw_bytes.log" 2>&1
          cargo +nightly-2026-10-06 fuzz run sql_grammar "$RUNNER_TEMP/fuzz/corpus/sql_grammar" -- -seed=20261007 -max_total_time=60 -timeout=5 -max_len=4096 -artifact_prefix="$RUNNER_TEMP/fuzz/artifacts/sql_grammar/" > "$RUNNER_TEMP/fuzz/sql_grammar.log" 2>&1
          cargo +nightly-2026-10-06 fuzz run html_grammar "$RUNNER_TEMP/fuzz/corpus/html_grammar" -- -seed=20261007 -max_total_time=60 -timeout=5 -max_len=4096 -artifact_prefix="$RUNNER_TEMP/fuzz/artifacts/html_grammar/" > "$RUNNER_TEMP/fuzz/html_grammar.log" 2>&1
          tail -n 4 "$RUNNER_TEMP/fuzz/raw_bytes.log"
          tail -n 4 "$RUNNER_TEMP/fuzz/sql_grammar.log"
          tail -n 4 "$RUNNER_TEMP/fuzz/html_grammar.log"

      - name: Upload fuzz logs and findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fuzz/*.log
            ${{ runner.temp }}/fuzz/artifacts/**
          if-no-files-found: warn
          retention-days: 30
