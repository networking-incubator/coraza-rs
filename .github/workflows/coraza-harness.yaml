name: Coraza harness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  go-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: benchmarks/coraza/go/go.mod
          cache: true
          cache-dependency-path: benchmarks/coraza/go/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Run Go harness checks
        run: make go-harness-check

  coraza-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: coraza-examples

      - name: Run Coraza example tests
        run: make coraza-example-test

  ftw-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: ftw-smoke

      - name: Set up Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ftw-runner/go.mod
          cache: true
          cache-dependency-path: ftw-runner/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Check FTW runner
        run: make ftw-runner-check

      - name: Run strict FTW smoke
        run: make ftw-smoke

      - name: Upload FTW smoke manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftw-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ftw-smoke-result.json
          if-no-files-found: warn
          retention-days: 30
