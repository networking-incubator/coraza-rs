name: Focused fuzzing

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "release/**"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  focused-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: focused-fuzz

      - name: Install nightly fuzz toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-06
          components: rust-src

      - name: Install cargo-fuzz
        run: cargo +1.99.1 install --root "$RUNNER_TEMP/cargo-fuzz" --locked cargo-fuzz --version 0.13.2

      - name: Run detector and SecLang grammar campaigns
        env:
          ASAN_OPTIONS: detect_leaks=0
          RUSTUP_TOOLCHAIN: nightly-2026-10-06
        working-directory: libperfusion
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz/corpus/raw_bytes" "$RUNNER_TEMP/fuzz/corpus/sql_grammar" "$RUNNER_TEMP/fuzz/corpus/html_grammar"
          mkdir -p "$RUNNER_TEMP/fuzz/artifacts/raw_bytes" "$RUNNER_TEMP/fuzz/artifacts/sql_grammar" "$RUNNER_TEMP/fuzz/artifacts/html_grammar"
          export PATH="$RUNNER_TEMP/cargo-fuzz/bin:$PATH"
          cargo fuzz run raw_bytes "$RUNNER_TEMP/fuzz/corpus/raw_bytes" -- -seed=20261007 -max_total_time=60 -timeout=5 -max_len=262144 -artifact_prefix="$RUNNER_TEMP/fuzz/artifacts/raw_bytes/" > "$RUNNER_TEMP/fuzz/raw_bytes.log" 2>&1
          cargo fuzz run sql_grammar "$RUNNER_TEMP/fuzz/corpus/sql_grammar" -- -seed=20261007 -max_total_time=60 -timeout=5 -max_len=4096 -artifact_prefix="$RUNNER_TEMP/fuzz/artifacts/sql_grammar/" > "$RUNNER_TEMP/fuzz/sql_grammar.log" 2>&1
          cargo fuzz run html_grammar "$RUNNER_TEMP/fuzz/corpus/html_grammar" -- -seed=20261007 -max_total_time=60 -timeout=5 -max_len=4096 -artifact_prefix="$RUNNER_TEMP/fuzz/artifacts/html_grammar/" > "$RUNNER_TEMP/fuzz/html_grammar.log" 2>&1
          tail -n 4 "$RUNNER_TEMP/fuzz/raw_bytes.log"
          tail -n 4 "$RUNNER_TEMP/fuzz/sql_grammar.log"
          tail -n 4 "$RUNNER_TEMP/fuzz/html_grammar.log"

      - name: Run Coraza SecLang grammar campaign
        env:
          ASAN_OPTIONS: detect_leaks=0
          RUSTUP_TOOLCHAIN: nightly-2026-10-06
        working-directory: coraza
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz/corpus/coraza_variable_list" "$RUNNER_TEMP/fuzz/artifacts/coraza_variable_list"
          export PATH="$RUNNER_TEMP/cargo-fuzz/bin:$PATH"
          cargo fuzz run coraza_variable_list "$RUNNER_TEMP/fuzz/corpus/coraza_variable_list" -- -seed=20261007 -max_total_time=60 -timeout=5 -max_len=4096 -artifact_prefix="$RUNNER_TEMP/fuzz/artifacts/coraza_variable_list/" > "$RUNNER_TEMP/fuzz/coraza_variable_list.log" 2>&1
          tail -n 4 "$RUNNER_TEMP/fuzz/coraza_variable_list.log"

      - name: Upload fuzz logs and findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focused-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fuzz/*.log
            ${{ runner.temp }}/fuzz/artifacts/**
          if-no-files-found: warn
          retention-days: 30
