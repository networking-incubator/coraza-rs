name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: Enable verbose test output (V=1)
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  V: ${{ inputs.debug && '1' || '' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust (stable + nightly fmt)
        uses: $/.github/actions/setup-rust-lint
        with:
          libclang: true

      - name: Cache cargo-machete
        id: cache-machete
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-machete
          key: cargo-machete-${{ runner.os }}-0.9.2

      - name: Install cargo-machete
        if: steps.cache-machete.outputs.cache-hit != 'true'
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Lint
        run: make lint

      - name: Initialize CodeQL (Rust)
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust

      - name: Build for CodeQL
        run: cargo build --workspace

      - name: Analyze CodeQL results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          libclang: true

      - name: Test
        run: make test

  envoy-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: envoy-wasm

      - name: Build Envoy filter
        run: make build-envoy-wasm

      - name: Run Envoy integration checks
        run: ./examples/envoy-libperfusion/test-envoy.sh

  envoy-wasm-crs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: envoy-wasm-crs

      - name: Fetch the pinned CRS release
        run: make crs-fetch

      - name: Build Envoy filter with embedded CRS
        run: make build-envoy-wasm-crs

      - name: Test the embedded CRS policy
        run: make test-envoy-wasm-crs

      - name: Run Envoy lifecycle checks against the CRS build
        run: bash examples/envoy-coraza/test-envoy.sh
        env:
          ENVOY_CORAZA_MAKE_TARGET: build-envoy-wasm-crs

  envoy-dynamic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: envoy-dynamic
          libclang: true

      - name: Build native Envoy module
        run: make build-envoy-dynamic

      - name: Run native Envoy integration checks
        run: make test-envoy-dynamic

  envoy-dynamic-crs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: envoy-dynamic-crs
          libclang: true

      - name: Fetch the pinned CRS release
        run: make crs-fetch

      - name: Build native Envoy module with embedded CRS
        run: make build-envoy-dynamic-crs

      - name: Test the embedded CRS policy
        run: cargo test -p envoy-coraza-dynamic --features embed-crs

      - name: Run native Envoy integration checks
        run: make test-envoy-dynamic

  envoy-dynamic-derived-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            profile: default
            cargo_features: ""
          - architecture: amd64
            platform: linux/amd64
            profile: crs
            cargo_features: embed-crs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Envoy image
        id: envoy-image
        run: echo "image=$(make --no-print-directory print-envoy-image)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Fetch the pinned CRS release
        if: matrix.profile == 'crs'
        run: make crs-fetch

      - name: Build and smoke-test derived Envoy image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ matrix.profile }}
          CARGO_FEATURES: ${{ matrix.cargo_features }}
          ENVOY_IMAGE: ${{ steps.envoy-image.outputs.image }}
        run: python3 examples/envoy-coraza-dynamic/test.py derived-image

  envoy-dynamic-ftw:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      FTW_INCLUDE_TESTS: '^(932161-7|934120-23|941120-49|949110-4|944110-18|911100-1|920100-1|932161-1|942100-1|949110-1)$'
      FTW_ALLOW_FAILURES_FILE: examples/envoy-coraza-dynamic/ftw-ci-allowed-failures.txt
      FTW_EXPECTED_SELECTED_TESTS: '10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: envoy-dynamic-ftw
          libclang: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ftw-runner/go.mod
          cache-dependency-path: ftw-runner/go.sum

      - name: Run bounded native CRS FTW gate
        run: make test-envoy-dynamic-ftw
        env:
          FTW_OUTPUT_DIR: ${{ runner.temp }}/envoy-dynamic-ftw

      - name: Upload FTW logs and manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: envoy-dynamic-ftw-${{ github.run_id }}
          path: ${{ runner.temp }}/envoy-dynamic-ftw
          if-no-files-found: warn

  meta-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TYPOS_VERSION: v1.42.1
      TYPOS_SHA256: fe1492d6c1079c328ef66de2094b7a3a4569987ec972ab56002c5db4746a8d1b
      TAPLO_VERSION: 0.10.0
      TAPLO_SHA256: 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156
      ACTIONLINT_VERSION: 1.7.10
      ACTIONLINT_SHA256: f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -sSL -o "$RUNNER_TEMP/tools/typos.tar.gz" \
            "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  $RUNNER_TEMP/tools/typos.tar.gz" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/tools/typos.tar.gz" -C "$HOME/.local/bin" ./typos

          curl -sSL -o "$RUNNER_TEMP/tools/taplo.gz" \
            "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/taplo-linux-x86_64.gz"
          echo "${TAPLO_SHA256}  $RUNNER_TEMP/tools/taplo.gz" | sha256sum --check --strict
          gunzip -c "$RUNNER_TEMP/tools/taplo.gz" > "$HOME/.local/bin/taplo"
          chmod +x "$HOME/.local/bin/taplo"

          curl -sSL -o "$RUNNER_TEMP/tools/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/tools/actionlint.tar.gz" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/tools/actionlint.tar.gz" -C "$HOME/.local/bin" actionlint

      - name: Lint extra
        run: make lint-extra

  feature-matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: features
          libclang: true

      - name: Cache cargo-hack
        id: cache-hack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hack
          key: cargo-hack-${{ runner.os }}-0.6.45

      - name: Install cargo-hack
        if: steps.cache-hack.outputs.cache-hit != 'true'
        run: cargo install cargo-hack --version 0.6.45 --locked

      - name: Fetch the pinned CRS release
        run: make crs-fetch

      - name: Clippy each feature
        run: cargo hack clippy --workspace --each-feature --all-targets -- -D warnings

      - name: Test each feature
        run: cargo hack test --workspace --each-feature

      - name: Test the digest-free FIPS profile
        run: cargo test -p coraza --no-default-features --features fips

      - name: Verify the FIPS dependency graph
        run: tree=$(cargo tree -p coraza --no-default-features --features fips) && ! printf '%s\n' "$tree" | grep -Eq '(^|[[:space:]])(md-5|sha1) v'
