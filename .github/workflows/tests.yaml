name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: Enable verbose test output (V=1)
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  V: ${{ inputs.debug && '1' || '' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust (stable + nightly fmt)
        uses: ./.github/actions/setup-rust-lint

      - name: Cache cargo-machete
        id: cache-machete
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-machete
          key: cargo-machete-${{ runner.os }}-0.9.2

      - name: Install cargo-machete
        if: steps.cache-machete.outputs.cache-hit != 'true'
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Lint
        run: make lint

      - name: Initialize CodeQL (Rust)
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust

      - name: Build for CodeQL
        run: cargo build --workspace

      - name: Analyze CodeQL results
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Test
        run: make test

  production-assurance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: production-assurance

      - name: Check feature profiles and allocation gates
        run: make feature-check

      - name: Check WASI feature profiles
        run: make wasm-check

      - name: Verify packaged crate and offline builds
        run: make package-check

  miri:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-10-06
          components: miri,rust-src

      - name: Run targeted parser Miri checks
        run: make miri-check

  differential:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: differential

      - name: Set up pinned Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: Record Go toolchain and target
        run: |
          go version
          go env GOEXPERIMENT GOOS GOARCH

      - name: Check out pinned Go oracle source
        env:
          GO_SOURCE: ${{ runner.temp }}/libinjection-go-v033
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/corazawaf/libinjection-go.git "$GO_SOURCE"
          git -C "$GO_SOURCE" fetch --depth=1 origin f6c336efc0ddac2597fd27d3b1b7db9c87613e8d
          git -C "$GO_SOURCE" checkout --detach f6c336efc0ddac2597fd27d3b1b7db9c87613e8d
          test "$(git -C "$GO_SOURCE" rev-parse HEAD)" = f6c336efc0ddac2597fd27d3b1b7db9c87613e8d

      - name: Compare keyword, dispatch, XSS tables, and source hashes to pinned Go
        env:
          GO_SOURCE: ${{ runner.temp }}/libinjection-go-v033
        run: python3 libinjection-rs/tools/parity/check_manifest.py --go-source "$GO_SOURCE"

      - name: Run corpus and generated-byte Go parity gates
        env:
          LIBINJECTION_GO_SOURCE: ${{ runner.temp }}/libinjection-go-v033
        run: make parity-differential

  hostile-scaling-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: hostile-scaling-smoke

      - name: Set up pinned Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: Check out pinned Go oracle source
        env:
          GO_SOURCE: ${{ runner.temp }}/libinjection-go-v033
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/corazawaf/libinjection-go.git "$GO_SOURCE"
          git -C "$GO_SOURCE" fetch --depth=1 origin f6c336efc0ddac2597fd27d3b1b7db9c87613e8d
          git -C "$GO_SOURCE" checkout --detach f6c336efc0ddac2597fd27d3b1b7db9c87613e8d
          test "$(git -C "$GO_SOURCE" rev-parse HEAD)" = f6c336efc0ddac2597fd27d3b1b7db9c87613e8d

      - name: Run hostile-input scaling gate
        env:
          GO_SOURCE: ${{ runner.temp }}/libinjection-go-v033
        run: >-
          python3 libinjection-rs/tools/perf/scaling.py
          --go-source "$GO_SOURCE"
          --artifact-dir "$RUNNER_TEMP/perf-smoke/scaling"
          --samples 3 --warmup 0 --rounds 3 --idle-timeout 180

      - name: Upload performance smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostile-scaling-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/perf-smoke/scaling/**
          if-no-files-found: warn
          retention-days: 30

  meta-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: Install locked lint tools
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          mkdir -p "$GOBIN"
          echo "$GOBIN" >> "$GITHUB_PATH"
          cargo install typos-cli --version 1.42.1 --locked
          cargo install taplo-cli --version 0.10.0 --locked
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10

      - name: Lint extra
        run: make lint-extra

  feature-matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: features

      - name: Cache cargo-hack
        id: cache-hack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-hack
          key: cargo-hack-${{ runner.os }}-0.6.45

      - name: Install cargo-hack
        if: steps.cache-hack.outputs.cache-hit != 'true'
        run: cargo install cargo-hack --version 0.6.45 --locked

      - name: Clippy each feature
        run: cargo hack clippy --workspace --each-feature --all-targets -- -D warnings

      - name: Test each feature
        run: cargo hack test --workspace --each-feature
