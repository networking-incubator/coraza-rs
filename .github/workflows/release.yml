name: release

on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC daily
  workflow_dispatch:
  # Manual releases: push a vX.Y.Z tag. Nightlies never push a tag (GoReleaser
  # creates it when publishing), so only manual tags reach this trigger.
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

# Serialize all runs of this workflow: nightly and manual releases publish
# the same GHCR tags, so they must not overlap. Never cancel an in-flight
# release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    # Defense in depth: never release from a nightly-named tag push (the
    # nightly run does not push tags, but a manual one should not release).
    if: github.event_name != 'push' || !contains(github.ref, 'nightly')
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      # GoReleaser creates the GitHub release and its assets.
      contents: write
      # Push the WASMPlugin images to GHCR.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags so GoReleaser can resolve the version.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-suffix: nightly

      - name: Add wasm target
        run: rustup target add wasm32-wasip1

      # Pinned binaryen release (the same version the Istio demo validates
      # with) for the wasm-as/wasm-merge pair that links the WASI stubs into
      # the published artifacts. Mirrors the lint-extra job: verify the
      # tarball digest and install into $HOME/.local/bin (already on PATH,
      # not world-writable).
      - name: Install binaryen
        env:
          BINARYEN_VERSION: version_123
          BINARYEN_SHA256: e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe
        run: |
          curl -sSL -o "$RUNNER_TEMP/binaryen.tar.gz" \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$HOME/.local/bin" \
            --strip-components=2 \
            "binaryen-${BINARYEN_VERSION}/bin/wasm-as" \
            "binaryen-${BINARYEN_VERSION}/bin/wasm-merge"

      - name: Build WASM filters
        run: |
          ./envoy-coraza/crs-fetch.sh
          mkdir -p release-artifacts
          # Link the WASI ENOSYS stubs (envoy-coraza/wasi-stub.wat) into the
          # published artifacts so they also load on Envoy below 1.40 (e.g.
          # Istio 1.30), whose Proxy-Wasm host does not provide those imports;
          # on newer Envoy the extra imports are unused.
          wasm-as envoy-coraza/wasi-stub.wat -o /tmp/wasi-stub.wasm
          link_stubs() {
            wasm-merge /tmp/wasi-stub.wasm wasi_snapshot_preview1 \
              "$1" envoy-coraza -o "$2" \
              --rename-export-conflicts --all-features
          }
          cargo build --locked --release --target wasm32-wasip1 -p envoy-coraza
          link_stubs target/wasm32-wasip1/release/envoy_coraza.wasm release-artifacts/coraza-rs.wasm
          cargo build --locked --release --target wasm32-wasip1 -p envoy-coraza --features envoy-coraza/embed-crs
          link_stubs target/wasm32-wasip1/release/envoy_coraza.wasm release-artifacts/coraza-rs-crs.wasm

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # OSS GoReleaser has no nightly support (Pro-only), so the nightly tag is
      # passed to GoReleaser via GORELEASER_CURRENT_TAG instead: GoReleaser
      # creates the tag (at this commit) and the release when publishing, and
      # an existing same-day tag is never moved. Manual releases use the pushed
      # vX.Y.Z tag directly (GoReleaser detects it from the checkout).
      - name: Set nightly tag for GoReleaser
        if: github.event_name != 'push'
        run: echo "GORELEASER_CURRENT_TAG=v0.0.0-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      # Only the newest vX.Y.Z release may publish the shared `latest` image
      # tags, so a delayed or backported older tag cannot move them backwards.
      - name: Check whether to publish latest image tags
        if: github.event_name == 'push'
        run: |
          newest="$(git tag --list 'v[0-9]*' | grep -v -- '-nightly\.' | sort -V | tail -1)"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "PUSH_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "PUSH_LATEST=false" >> "$GITHUB_ENV"
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
