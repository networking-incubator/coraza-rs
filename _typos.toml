[files]
extend-exclude = [
  "libinjection-rs/data/sqli_keywords.txt",
  # These are byte-pinned upstream fixtures, not repository prose.
  "libinjection-rs/tests/corpus/*.txt",
  # This generated report embeds raw disassembly operands and addresses.
  "libinjection-rs/docs/evidence/stack-matrix.json",
]

[default.extend-words]
# Libinjection fingerprint marker and browser event name.
UE = "UE"
SEEKED = "SEEKED"
Unparseable = "Unparseable"
unparseable = "unparseable"

# Intentional upstream test names and fixture literals.
Attribures = "Attribures"
som = "som"
fo = "fo"
sur = "sur"
leasure = "leasure"
asure = "asure"
caf = "caf"
ue = "ue"
OMMAND = "OMMAND"
Nd = "Nd"

[type.rust]
# Preserve the upstream HTML regression payload's comment-split javascript token.
extend-ignore-re = ["javas<!-- -->cript"]
