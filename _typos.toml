[files]
extend-exclude = [
    "libperfusion/data/sqli_keywords.txt",
    "libperfusion/data/sqli_keywords_local.txt",
    "libperfusion/tests/corpus/test-*.txt",
    # Exact HTML5 entity names and code-point mappings from Go's html package.
    "coraza/src/transformations/html_entities.rs",
    # Exact Unicode best-fit mapping data from the Coraza port.
    "coraza/src/transformations/unicode_bestfit.rs",
    # Exact HTML entity names and mappings from Go's encoding/xml port.
    "coraza/src/body_processors/xml/tables.rs",
]

[default]
extend-ignore-re = [
    '<XML ID="xss"><I><B>&lt;IMG SRC="javas<!-- -->cript:javascript:alert\(1\)"&gt;</B></I></XML><SPAN DATASRC="#xss" DATAFLD="B" DATAFORMATAS="HTML"></SPAN>',
    'x:ontimer=.*cript\$x:alert\(1\)',
]

[default.extend-identifiers]
# Detector fixture literals, keyed on the whole identifier so the words they
# split into ("UNIO", "SELEC") stay typos everywhere else.
#
# "UNIONb" is SQLi fixture bytes in envoy-libperfusion/src/inspect.rs: the
# payload runs the keyword straight into the next token, and those exact
# bytes are what the regression reproduces.
UNIONb = "UNIONb"
# "SELEC" is the truncated keyword libperfusion/src/sqli/keywords.rs looks up
# to assert that a prefix of a keyword does not match one.
SELEC = "SELEC"
# "MatchedDatas" is the pinned Go Coraza v3.8.1 API method
# (corazarules.MatchedRule.MatchedDatas), called in
# benchmarks/coraza/go/outcome.go to read each matched rule's match data.
MatchedDatas = "MatchedDatas"

[default.extend-words]
# Libinjection fingerprint marker and browser event name.
UE = "UE"
SEEKED = "SEEKED"
Unparseable = "Unparseable"
unparseable = "unparseable"

# Short name for comment length in the SQL lexer.
clen = "clen"

# Intentional upstream test names and fixture literals.
Attribures = "Attribures"
som = "som"
fo = "fo"
sur = "sur"
leasure = "leasure"
asure = "asure"
caf = "caf"
ue = "ue"
OMMAND = "OMMAND"
Nd = "Nd"
