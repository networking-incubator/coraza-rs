[package]
name = "envoy-libperfusion"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Envoy Proxy-Wasm HTTP filter backed by libperfusion"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
form_urlencoded = "1.2"
futures = "0.3"
libperfusion = { path = "../libperfusion" }
log = "0.4"
multer = { version = "3.1", default-features = false }
proxy-wasm = "=0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
