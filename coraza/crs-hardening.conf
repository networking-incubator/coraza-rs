# -- 10932238: a backtick that starts a command, PL3 and above ----------------
#
# CRS rule 932238 (PL3) takes a backtick as the start of a command, but
# `t:cmdLine` removes the backtick before the rule reads it, so
# `foo`whoami``, `echo `whoami`` and ``for /f %i `in(`whoami`) do echo %i``
# lose the 5 points it gives at level 3 and 4. This rule reads the value
# without `t:cmdLine`: a backtick, optional spaces and quotes, an optional
# path and a command name from a short list, followed by a separator. Like
# 932238 it runs only at paranoia level 3 and above, since `id`, `cat` or
# `ls` between backticks is ordinary prose (code spans of a comment field).
# The level is the one the CRS BLOCKS at (`tx.blocking_paranoia_level`): the CRS
# lets a deployment detect at level 3 and block at level 1, where a match is only
# logged, and this rule is a `deny`; keyed on the detection level it would turn
# that logging into a block. Without the CRS the variable is unset (`@lt 3` does not
# match an unset variable, `&TX:BLOCKING_PARANOIA_LEVEL` counts it as 0), and the
# rule stays off: a policy without the CRS has no level to read, and would
# otherwise hard-deny the code spans of a comment field.
SecRule &TX:BLOCKING_PARANOIA_LEVEL "@eq 0" "id:10932011,phase:1,pass,nolog,skipAfter:END-CRS-HARDENING-PL3"
SecRule &TX:BLOCKING_PARANOIA_LEVEL "@eq 0" "id:10932012,phase:2,pass,nolog,skipAfter:END-CRS-HARDENING-PL3"
SecRule TX:BLOCKING_PARANOIA_LEVEL "@lt 3" "id:10932013,phase:1,pass,nolog,skipAfter:END-CRS-HARDENING-PL3"
SecRule TX:BLOCKING_PARANOIA_LEVEL "@lt 3" "id:10932014,phase:2,pass,nolog,skipAfter:END-CRS-HARDENING-PL3"
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization|XML:/*|XML://@* \
    "@rx (?i)`[\s\x0b]*[\x22\x27]*(?:[^`\s\x0b\x22\x27]*/)?(?:whoami|id|uname|hostname|pwd|ls|dir|cat|tac|ps|top|env|printenv|set|ifconfig|ipconfig|ip|netstat|ss|route|arp|who|w|last|df|du|free|uptime|curl|wget|nc|ncat|netcat|telnet|ssh|scp|ftp|tftp|nslookup|dig|host|ping|traceroute|bash|sh|zsh|ksh|csh|dash|python[0-9.]*|perl|ruby|php|node|java|lua|powershell|pwsh|cmd|certutil|bitsadmin|echo|printf|sleep|touch|rm|mv|cp|chmod|chown|mkdir|tar|gzip|base64|xxd|od|head|tail|grep|egrep|awk|sed|find|which|whereis|file|strings|sort|cut|tr|xargs|eval|exec|source|su|sudo|kill|crontab|systemctl|service|mount|nohup)(?:[\s\x0b\x22\x27`;|&)<>]|$)" \
    "id:10932238,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,msg:'Backtick command substitution',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-rce',tag:'paranoia-level/3'"
SecMarker "END-CRS-HARDENING-PL3"
