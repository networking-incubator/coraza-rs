# -- CRS hardening supplement ------------------------------------------------
#
# Rules that close gaps of the OWASP Core Rule Set (CRS) at paranoia level 1.
# They are original to this project and stricter than the CRS: they are not part
# of Go Coraza, of the CRS or of coraza.conf-recommended, and a policy that
# loads them blocks requests the CRS alone lets through.
#
# Load it AFTER the CRS rules (the envoy-coraza filter ships it as the built-in
# file `@crs-hardening-conf`; embedders use `coraza::seclang::CRS_HARDENING_CONF`):
#
#   Include @recommended-conf
#   SecRuleEngine On
#   Include crs/crs-setup.conf
#   Include crs/rules/*.conf
#   Include @crs-hardening-conf
#
# Why the order is fixed. The retargeting block below only updates rules that
# are already defined, and the deny rules are not scored: a scoring rule placed
# before the CRS is reset by rule 901200 under multiphase evaluation, and one
# placed after it is never read by 949110 without multiphase evaluation. A
# `deny` rule after the CRS blocks in both modes. Included before the CRS, the
# file still denies the Java and GraphQL cases and the substitution rules, but
# the header retargeting does nothing.
#
# Tuning the header retargeting. `SecRuleUpdateTargetById <id>
# "!REQUEST_HEADERS:<name>"` and `SecRuleUpdateTargetByTag` lines that exclude a
# header from a rule apply to the targets the rule has at that line. Put them
# AFTER `Include @crs-hardening-conf`. One placed before it (the CRS's own
# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf, which `Include crs/rules/*.conf`
# loads, is before it) does not reach the header target that H1 adds later: H1
# appends a new `REQUEST_HEADERS` target with only its own exceptions, so the rule
# reads that header again. There is no ordering in this file that fixes it: it
# cannot copy a tuning it has not read. What works whatever the position of this
# file: a runtime `ctl:ruleRemoveTargetById=<id>;REQUEST_HEADERS:<name>` or
# `ctl:ruleRemoveTargetByTag=<tag>;REQUEST_HEADERS:<name>` in a rule of an
# exclusion file loaded before the CRS rules (a `ctl` acts on the rules evaluated
# after it, so one placed after the CRS is too late under multiphase evaluation),
# `ctl:ruleRemoveByTag=crs-hardening` for a path, and `ctl:ruleEngine=Off`.
# Rule 10932235 is a copy of rule 932235 for the `User-Agent`: removing 932235 does
# not remove it (see its section).
#
# Without the CRS the file parses and its deny rules work; the retargeting
# lines match nothing. Rule 10932238 reads the CRS's `tx.blocking_paranoia_level`
# to stay off below level 3; without the CRS the variable is unset, and the rule
# stays off as well.
#
# Rules in this file (ids follow the CRS rule they extend, behind the prefix 10):
#
#   H1, H2    Retarget existing CRS rules, so a payload in a request header gets
#             the same verdict as the same payload in a query argument.
#   10944130  Java gadget class names           (CRS 944130 has a short list)
#   10944210  Java serialized objects           (CRS 944210 is PL2 and misses
#                                                most base64 and every hex form)
#   10941100/1/3/4, 10930120/1
#             Payloads wrapped in base64 or hex (decoded XSS, system files); the
#             XSS rules read a value that is entirely base64 (8 to 256 characters;
#             10941103 reads one that is percent-encoded, in an argument) or hex
#             (8 to 512 characters)
#   10941102  XSS in a request header, read raw (CRS rule 941100 reads two headers)
#   10942100/1 SQL injection in a base64 or hex wrapped value: DISABLED, see below
#   10934900/1/2 GraphQL introspection
#   10932130  Command substitution inside a word, that prints nothing
#   10932235  The User-Agent for CRS rule 932235, except Composer's
#   10932238  Backtick command substitution, PL3 and above
#
# Measured effect with the CRS pinned in envoy-coraza/crs.pin, the recommended
# baseline and multiphase evaluation (the connector's mode), over the requests
# of envoy-coraza/testdata/crs-hardening-gate.json. Requests blocked, without
# the file / with it:
#
#   paranoia level                         1         2         3         4
#   84 benign requests                6 /   6  26 /  26  33 /  33  80 /  80
#   8 plain requests                  0 /   0   0 /   0   1 /   1   5 /   5
#   22 browser and API header sets    0 /   0   0 /   0   2 /   2   3 /   3
#   35 User-Agent values              0 /   0   0 /   0   0 /   0   0 /   0
#   21 proxy and browser header sets  0 /   0   0 /   0   1 /   1   3 /   3
#   37 ordinary requests              1 /   1   5 /   5   9 /   9  25 /  25
#   20 encoded-looking benign values  0 /   0   0 /   0   0 /   0   7 /   7
#   163 real-world User-Agents        0 /   0   1 /   1   9 /   9   9 /   9
#   116 real-world header sets       10 /  10  13 /  13  19 /  19 103 / 103
#   79 follow-ups of benign pages     0 /   0  16 /  16  16 /  16  62 /  62
#      (the page URL in Referer, HX-Current-URL, X-Original-URL, X-Original-URI,
#      X-Auth-Request-Redirect, X-Rewrite-URL, X-WAWS-Unencoded-URL,
#      X-Forwarded-Uri, X-Forwarded-Path, X-Envoy-Original-Path, Next-Url)
#   9 keys and fields named __type    0 /   0   1 /   1   4 /   4   6 /   6
#   33 cookie sets (some hold a URL)  0 /   0   5 /   5   6 /   6  15 /  15
#   14 logins with generated passwords
#                                     0 /   0  12 /  12  12 /  12  14 /  14
#   16 old Chromium client hints and Composer User-Agents
#                                     0 /   0  10 /  10  10 /  10  10 /  10
#   10 JSON bodies with base64 (one line or wrapped at 76 columns) or hex file
#      content, 16 to 256 KiB         0 /   0   7 /   7   7 /   7   7 /   7
#   7 headers of real clients (Forwarded with an IPv6 client, OData Prefer,
#      copies of Accept-Encoding)     0 /   0   0 /   0   0 /   0   3 /   3
#   16 encoded values (percent-encoded return paths and padded session ids in
#      a cookie, session cookies of Rails, PHP and ASP.NET Core, URL-safe
#      tokens, a signature, a PEM certificate, `<` in prose)
#                                     0 /   0   4 /   4   5 /   5   6 /   6
#   17 payloads in 4 places (68)     42 /  67  44 /  67  44 /  67  62 /  67
#   18 Java cases                     3 /  18   9 /  18   9 /  18  17 /  18
#   9 commands in the User-Agent      0 /   9   7 /   9   7 /   9   7 /   9
#   10 payloads in headers named after a path, a URL or an encoding
#      (X-File-Path, X-Webhook-Url, X-Callback-Uri, ...)
#                                     0 /  10   0 /  10   0 /  10   1 /  10
#   4 angle-bracket payloads in headers that CRS rule 941100 does not read
#                                     0 /   4   1 /   4   2 /   4   4 /   4
#   39 payloads in headers that CRS rules already read
#                                    39 /  39  39 /  39  39 /  39  39 /  39
#
# The requests carry the headers the Envoy connector hands the engine on top of
# their own: `:authority`, `:path`, `:method`, `:scheme`, `x-forwarded-proto` and
# `x-request-id`.
#
# On the requests of those ordinary groups, which are a sample and not all traffic,
# the file adds no block at any paranoia level 1 to 4: what blocks in the rows above
# is what the CRS alone blocks (the CRS itself blocks the 6 benign requests and 10
# real-world header sets at level 1). Other traffic can differ: the sample missed
# the false positives that review rounds found one by one, and the gate now holds
# them. The header retargeting covers the paranoia level 1 rules only, and a rule of
# a higher level keeps the targets it has, so a request that a PL2 to PL4 rule
# scores is scored as before. The last row is a regression guard: a
# Log4Shell, Shellshock, `../` or Java payload in `Accept-Language`,
# `Accept-Encoding`, `Host`, `Accept`, `Content-Type` or `Content-Length` is read
# by CRS rules that already scan every header, and the file must leave them alone.
#
# The X2 evasion matrix (273,618 attack requests; envoy-coraza/README.md) at level
# 1: 60.5 percent bypass with the CRS alone, 55.9 percent with the file. The price of
# the exclusions below, by transport (with the file, before the exclusion): `Referer`
# 71.7 (62.1); the CRS alone: 91.6. The `User-Agent` is read by rule 10932235: 60.0
# (65.2 with the exclusion alone, 89.2 with the CRS alone).
#
# What the file does not cover (known residue):
#   - A command string in a request cookie that the cookie parser splits at `;`.
#   - The SQL injection payload of a header, a cookie or an argument that is
#     wrapped in base64 or hex (rules 10942100 and 10942101 are off).
#   - GraphQL query depth and alias limits: they need a GraphQL-aware operator.
#     A query in an `operations` field of a multipart request, or nested below
#     another JSON key than an array index, is not read either.
#   - A Java stream in base64 that a space or a line break splits inside the
#     magic (MIME decoders and Apache Commons Codec skip them).
#   - A multipart file part: the engine does not read file content
#     (`FILES_TMP_CONTENT` is unsupported), so a gadget JSON or a serialized-object upload
#     passes it, as in the CRS. The Envoy connector refuses file parts with 413.
#   - A command substitution that holds `.`, `-`, `;`, `$x` or a longer command
#     inside a word, and an empty `$@` or `$*` inside a word (rule 10932130).
#   - A command in a path segment, not in the query string: the CRS reads the path
#     through `REQUEST_FILENAME` only, and at paranoia level 1 it does not match
#     `/app/;cat%20/etc/passwd`, with and without this file (a command in the query
#     string blocks, and at level 2 the CRS blocks this one).
#   - A command in `Referer` or in one of the ten other page-URL headers (listed
#     below) for rules 930120, 932120, 932160 and 932235, and in `TE` or one of the
#     seven copies of `Accept-Encoding` for rule 932260: the other rules still read
#     them (see the exclusions below). A header under any other name is read.
#   - A payload wrapped in base64 that is longer than 256 characters (192 bytes; a
#     line break counts as a character), in hex longer than 512 characters (256
#     bytes), or in a value that holds more than rules 10941100, 10941101, 10941103
#     and 10941104 accept of an otherwise base64 or hex value: a junk byte before
#     the payload, a space or a tab anywhere in the value (Python `b64decode`, PHP
#     `base64_decode` and Node skip it), white space and then more text, more than
#     64 characters after one junk byte, a percent escape other than `%2B`, `%2F`
#     and `%3D`, a literal `+` in a percent-encoded value, a double-URL-encoded
#     value, and hex with an odd number of digits (Node's `Buffer.from(s, 'hex')`
#     drops the last digit; `hexDecode` fails on it).
#   - A base64 payload that is percent-encoded (`%2B`, `%2F`, `%3D`) in a cookie or a
#     header: rule 10941103 reads arguments only, because Rails and PHP percent-encode
#     base64 session cookies (see D1 to D4). PHP, Rack and Express decode `%50` for
#     `P` as well, so a payload in a cookie can use any escape.
#   - A payload in URL-safe base64 with a `-` or `_` early in a cookie: rule 10941104
#     decodes with `base64Decode`, which stops at the first one (see D1 to D4).
#   - A payload in `x-request-id` or `x-forwarded-proto` for the 49 retargeted rules,
#     when a client can choose them (see H1).
#   - Payloads that a backend decodes in a way no rule undoes (double encoding,
#     %u, overlong UTF-8, full-width forms).
#
# Known false positives (the CRS alone passes each; envoy-coraza/README.md gives the
# tuning, and the gate holds each as `known-false-positive`):
#   - A URL whose host is an IP address in a header other than `Origin`, `Referer`
#     and the page-URL headers, or in a cookie (rule 931100): Knative `ce-source:
#     https://10.96.0.1:443`, GitLab `X-Gitlab-Instance`, WebDAV `Destination`, an
#     intranet `X-Callback-Url` or `X-Forwarded-Url`, the NextAuth `callback-url`
#     cookie of an intranet site. A cookie locks the user out until it expires.
#   - An IPv6 host or a path with brackets in a page-URL header other than `Referer`
#     and `Origin` (rule 932130, which reads `[::1]` and `/products/[slug]` as a
#     shell glob): `HX-Current-URL: http://[::1]:5000/items`, `X-Original-URL:
#     https://[2001:db8::10]:8443/app/`, Vercel's `x-matched-path`. The file excludes
#     only `Referer` and `Origin` from 932130; the rule is not in the page-URL line.
#     Tuning, after the include: `SecRuleUpdateTargetById 932130
#     "!REQUEST_HEADERS:X-Original-URL"` (or the header's name).
#   - The `AWSALB` cookie of an AWS Application Load Balancer (also `AWSALBCORS` and
#     the target-group variants): 96 to 192 random bytes of base64, and 6 of 2,500
#     (0.24 percent) are denied by rule 10941104, as rule 10941100 denied them
#     before. A session cookie that matches locks its user out until it expires.
#     Tuning, after the include: `SecRuleUpdateTargetById 10941104
#     "!REQUEST_COOKIES:AWSALB"`. Any other cookie of random base64 is denied at
#     about the same rate; excluding all cookies from 10941104 (and 10941101, hex)
#     costs 14 requests of the X2 matrix.
#   - The Flask-RESTX field mask `X-Fields: {id,name}` (932280, brace expansion).
#   - The `User-Agent` `ansible-httpget` of Ansible's `uri` and `get_url` modules,
#     and a `User-Agent` that ends in `; gzip)` (932260, and 10932235 for the
#     second): at level 1 only, the CRS blocks them from level 2.
#   - A generated password with a pair of backticks (10932130, 0.2 to 0.5 percent of
#     the passwords of a manager that draws all punctuation) and the code spans of
#     a comment field at level 3 and above (10932238).
#   - Base64 of markup up to 192 bytes (256 characters) in a JSON field (10941100):
#     an SVG icon, an HTML snippet with an inline `style`, the `raw` message of the
#     Gmail API (an HTML mail part in base64url). The rule reads the decoded markup
#     as libinjection does, as the CRS does the same markup unencoded; the CRS alone
#     passes the encoded value. Tuning, after the include:
#     `SecRuleUpdateTargetById 10941100 "!ARGS:json.icon"` (`json.<field>` for a
#     JSON field, the name for a form or query argument).

# -- H1: let the CRS rules read every request header ---------------------------
#
# KEEP: the CRS reads the command, SQL, template, NoSQL, remote file and LDAP
# operators over arguments and cookies only (`REQUEST_HEADERS:User-Agent` and
# `:Referer` for some). A payload in `X-Forwarded-Host` or in a custom header
# scores 0 and reaches the backend. This adds every request header to the
# paranoia level 1 rules of those families, except the headers below, which
# carry no free text and make the rules fire on every request:
#   Cookie (cookies have their own variables), Accept, Accept-Encoding
#   (rule 932260 matches `gzip`, so without this exclusion 84 of 84 benign
#   requests block), Accept-Language, Host, Content-Type, Content-Length.
# and the pseudo-headers `:authority`, `:method`, `:path` and `:scheme`. The
# Envoy connector puts them in REQUEST_HEADERS like any other header, and `:path`
# holds the whole URI, query string included: the rules read it as free text, so
# `/search?q=ruby+on+rails+jobs` (932235) and `/docs/powershell/getting-started`
# (932120) would block. The CRS reads the URI through its own variables (`ARGS`,
# `REQUEST_FILENAME`): at paranoia level 1 it does not read a command in a path
# segment (`/app/;cat%20/etc/passwd` passes with and without this file; a command
# in the query string blocks).
# The two headers Envoy adds to every request, `x-request-id` (a generated UUID)
# and `x-forwarded-proto` (`http` or `https`), are left out as well: no rule needs
# to read a value Envoy writes. It saves about 190,000 instructions per request (2.8
# percent of a request, 10 percent of what the file costs). If a deployment lets a
# client choose them (a sidecar, or `preserve_external_request_id`), the 49 rules do
# not read a payload in them: of 590 payloads of the CRS's own tests, 561 block in
# `x-request-id` with the 49 rules reading it and 11 without (the CRS alone: 8). The
# file's own deny rules, and the CRS rules that already read every header, still do.
#
# The rules are listed by id, not by tag, and for two reasons:
#   - A negated key (`!REQUEST_HEADERS:Accept`) is an exception of every
#     `REQUEST_HEADERS` target of the rule, its own as well. The CRS rules that
#     already read the whole collection (930100, 930110, 932170, 944100, 944110,
#     944120, 944130 and 944150 at level 1) would stop seeing `Accept`,
#     `Accept-Encoding`, `Accept-Language`, `Host`, `Content-Type` and
#     `Content-Length`: Log4Shell, Shellshock, `../` and Java payloads in
#     `Accept-Language` would pass. Those rules are not listed.
#   - A tag also takes the 27 response rules 955xxx and every rule of a higher
#     level (which would block every Chromium browser and the major crawlers at
#     level 2 to 4) into the update. Only the level 1 rules are listed; a rule
#     of a higher level keeps the targets it has.
# The list is every level 1 request rule tagged `attack-rce`, `attack-sqli`,
# `attack-injection-generic`, `attack-rfi`, `attack-ssti` or `attack-lfi` that
# does not name `REQUEST_HEADERS` as a whole, and 921200 (LDAP injection, tagged
# `language-ldap`), minus 932180: it matches the names of restricted files
# (`version`, `self`, `.htaccess`) and reads only the uploaded file names and its
# own `X-Filename` headers; every header would make it block each Safari and
# Android WebView `User-Agent` (`Version/17.2`). A test in envoy-coraza compares
# the list with the pinned CRS, so a CRS update that adds or changes a rule fails
# it until the list is regenerated. The list holds for the pinned CRS only: a
# policy that supplies another CRS version (a configured `rule_data` entry) needs
# a list regenerated for that version, and nothing checks it there: an id that
# version lacks is ignored without an error, a rule it adds stays unretargeted, and
# a rule it changed to read a header natively may lose that header to a negated key.
SecRuleUpdateTargetById 921200 930120 930130 930140 931100 931110 931120 932120 932125 932130 932140 932160 932171 932175 932230 932235 932250 932260 932270 932280 932330 932340 932370 932380 934100 934130 934150 934160 934200 942100 942140 942151 942160 942170 942190 942220 942230 942240 942250 942270 942280 942290 942320 942350 942360 942500 942540 942550 942560 "REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS::authority|!REQUEST_HEADERS::method|!REQUEST_HEADERS::path|!REQUEST_HEADERS::scheme|!REQUEST_HEADERS:x-request-id|!REQUEST_HEADERS:x-forwarded-proto"

# -- H1 exclusions: headers that real clients send and a rule takes for an attack
#
# The headers below hold values these rules match on every request of a common
# client. Each line removes headers from some rules, and the rules keep every
# other header. None of these rules reads these headers without H1 (a test in
# envoy-coraza checks that against the pinned CRS), so nothing the CRS reads is
# lost. Without these lines H1 blocked 24 of the 279 requests of real clients that
# the gate holds (see the table above) at level 1; with them the file adds no
# block to any of the requests of the gate's ordinary groups at levels 1 to 4.
# Every key is a header name, never a pattern (see the page-URL headers below).
#   931100  `Origin`, `Referer` and the page-URL headers (below) with an IP address
#           as host (`http://127.0.0.1:5173`, `http://192.168.1.20:3000`).
#   932130  an `Origin` with an IPv6 host (`http://[::1]:3000`); expression `${`
#           and `[::1]` read as a shell expansion.
#   932120  the `User-Agent` of PowerShell (`WindowsPowerShell/5.1`, `pwsh`).
#   932370  the `User-Agent` of Microsoft Office (Outlook, Word, Excel).
#   932235  the `User-Agent` of Composer (`cURL 8.5.0` reads as the command `curl`
#           with an argument). Rule 10932235 below reads every other `User-Agent`
#           with the same operator and skips Composer's strict shape, so a command
#           in a `User-Agent` is still read by 932235.
#   932260  `gzip, deflate` in `TE` and in seven headers that copy or sibling
#           `Accept-Encoding`, by name (`Content-Encoding`, `X-Accept-Encoding`,
#           `X-Forwarded-Accept-Encoding`, `grpc-accept-encoding`, `grpc-encoding`,
#           `Fastly-Orig-Accept-Encoding`, `X-Original-Accept-Encoding`).
#   942100  `Signature-Input` and `Signature` of RFC 9421 HTTP message signatures,
#           and the OData `Prefer` header of Dataverse and Dynamics Web API clients
#           (`odata.include-annotations="*"`).
#   942100 942540
#           the `sec-ch-ua` and `sec-ch-ua-full-version-list` client hints of
#           Chromium 85 to 93, WebViews, Electron apps and scrapers that pin an
#           old release: their GREASE brand (`" Not A;Brand"`, `";Not A Brand"`)
#           holds a `;` and a quote. The two headers hold nothing but brand names
#           and versions.
#   942550  `Forwarded` (RFC 7239) with an IPv6 client and no port
#           (`for="[2001:db8:cafe::17]";proto=https`), the form HAProxy
#           `option forwarded` writes.
#   930120 932120 932160 932235
#           `Referer` and ten headers that carry the URL of a page, by name:
#           `HX-Current-URL`, `X-Original-URL`, `X-Original-URI`, `X-Forwarded-Uri`,
#           `X-Forwarded-Path`, `X-Envoy-Original-Path`, `X-Auth-Request-Redirect`,
#           `X-Rewrite-URL`, `X-WAWS-Unencoded-URL` and `Next-Url`. A browser sends
#           the page URL as `Referer` with every subresource and link click, htmx
#           sends it as `HX-Current-URL` with every request, and proxies send it as
#           `X-Original-URL`, `X-Original-URI`, `X-Forwarded-Uri`,
#           `X-Forwarded-Path`, `X-Auth-Request-Redirect` (oauth2-proxy),
#           `X-Rewrite-URL` (IIS ARR), `X-WAWS-Unencoded-URL` (Azure App Service),
#           `X-Envoy-Original-Path` and Next.js `Next-Url`. So a search for `ruby on
#           rails jobs` (932235), the path `/docs/powershell/getting-started`
#           (932120), `/docs/windows/system32` (930120) or `/bin/view` (932160)
#           blocked every request that followed it: 25 of 366 pages of the review's
#           corpus, 6.8 percent, for each of those headers. The CRS reads the URL
#           through its own variables (`REQUEST_FILENAME`, `ARGS`), and `:path` is
#           excluded for the same reason (see above). The price: a command in these
#           headers is not read by these four rules; the other rules of H1 and the
#           file's own deny rules still read them. In the X2 matrix the bypass of
#           the `referer` transport is 71.7 percent with the exclusion and 62.1
#           without (the CRS alone: 91.6).
#           The exclusion is a list of names, not a pattern on the end of a name
#           (`url`, `uri`, `path`, `redirect`): a client chooses the names of its
#           headers, and a backend feeds `X-File-Path`, `X-Image-Url`,
#           `X-Callback-Uri` or `X-Return-Redirect` to a file system or a fetcher.
#           A pattern would take exactly those headers from the rules that read
#           system files (930120), shell paths (932160), commands (932120, 932235)
#           and internal URLs (931100). A page-URL header that is not in the list
#           (nginx `proxy_set_header X-Request-URI $request_uri;`, `X-Forwarded-Url`)
#           is read, and its follow-ups block like the 25 pages above: one tuning
#           line after the include clears it,
#             SecRuleUpdateTargetById 930120 931100 932120 932160 932235 "!REQUEST_HEADERS:X-Request-URI"
SecRuleUpdateTargetById 931100 "!REQUEST_HEADERS:Referer|!REQUEST_HEADERS:Origin|!REQUEST_HEADERS:HX-Current-URL|!REQUEST_HEADERS:X-Original-URL|!REQUEST_HEADERS:X-Original-URI|!REQUEST_HEADERS:X-Forwarded-Uri|!REQUEST_HEADERS:X-Forwarded-Path|!REQUEST_HEADERS:X-Envoy-Original-Path|!REQUEST_HEADERS:X-Auth-Request-Redirect|!REQUEST_HEADERS:X-Rewrite-URL|!REQUEST_HEADERS:X-WAWS-Unencoded-URL|!REQUEST_HEADERS:Next-Url"
SecRuleUpdateTargetById 932130 "!REQUEST_HEADERS:Referer|!REQUEST_HEADERS:Origin"
SecRuleUpdateTargetById 932120 932370 "!REQUEST_HEADERS:User-Agent"
SecRuleUpdateTargetById 932235 "!REQUEST_HEADERS:User-Agent"
SecRuleUpdateTargetById 932260 "!REQUEST_HEADERS:TE|!REQUEST_HEADERS:Content-Encoding|!REQUEST_HEADERS:X-Accept-Encoding|!REQUEST_HEADERS:X-Forwarded-Accept-Encoding|!REQUEST_HEADERS:grpc-accept-encoding|!REQUEST_HEADERS:grpc-encoding|!REQUEST_HEADERS:Fastly-Orig-Accept-Encoding|!REQUEST_HEADERS:X-Original-Accept-Encoding"
SecRuleUpdateTargetById 942100 "!REQUEST_HEADERS:Signature-Input|!REQUEST_HEADERS:Signature|!REQUEST_HEADERS:Prefer"
SecRuleUpdateTargetById 942100 942540 "!REQUEST_HEADERS:sec-ch-ua|!REQUEST_HEADERS:sec-ch-ua-full-version-list"
SecRuleUpdateTargetById 942550 "!REQUEST_HEADERS:Forwarded"
