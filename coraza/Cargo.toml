[package]
name = "coraza"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SecLang rule compilation and request processing for a separate Rust implementation of Coraza"

[dependencies]
aho-corasick = "1.1"
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
http-body-util = { version = "0.1", optional = true }
glob = { workspace = true }
fastrand = "2"
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
ipnet = "2.9"
jsonschema = { version = "0.58", default-features = false, optional = true }
libperfusion = { version = "0.1.0", path = "../libperfusion" }
md-5 = "0.11"
mime = "0.3"
regex = "1.10"
serde_json = "1"
sha1 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"], optional = true }
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
winnow = "1.0.4"

[dev-dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
sha2 = "0.11"

[features]
async-server = ["dep:base64", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tokio"]
# `SecAuditLogType HTTPS` writer, via ureq's blocking client with rustls.
https-audit = ["dep:ureq"]
# `@inspectFile`, which runs a local program over each value.
inspect-file = []
# `@rbl`, which resolves a DNS blocklist. Split from `inspect-file` so an
# embedder can allow DNS lookups without granting process execution.
rbl = []
# Both host operators; the umbrella name this crate started with.
host-operators = ["inspect-file", "rbl"]
# `@validateSchema`, which compiles JSON Schema documents.
validate-schema = ["dep:jsonschema"]

[[example]]
name = "ftw_server_async"
required-features = ["async-server"]

[[bench]]
name = "coraza_workload"
harness = false

# Publish the feature-gated operators in the docs build, which otherwise shows
# only the default build.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
