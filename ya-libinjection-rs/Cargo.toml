[package]
name = "libinjection-rs"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[dependencies]

[features]
# Exposes implementation details to this crate's own tests. Not part of the
# API: anything behind it can change in any release.
internals = []

[dev-dependencies]
# Turns `internals` on for the tests, and only for them.
libinjection-rs = { path = ".", features = ["internals"] }
